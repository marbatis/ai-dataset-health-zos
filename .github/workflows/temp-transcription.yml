name: Temporary audio transcription

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package-whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential curl

      - name: Build whisper.cpp and download model
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release -j2
          mkdir -p package
          cp whisper.cpp/build/bin/whisper-cli package/
          cp whisper.cpp/build/src/libwhisper.so* package/ 2>/dev/null || true
          cp whisper.cpp/build/ggml/src/libggml*.so* package/ 2>/dev/null || true
          curl -L --fail --retry 3 -o package/ggml-base.en-q5_1.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin?download=true"
          chmod +x package/whisper-cli
          ls -lh package

      - name: Upload whisper package
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-package
          path: package/
          retention-days: 1
